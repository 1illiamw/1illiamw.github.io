<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William Alencar</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        
        <!-- Sua Foto Principal -->
        <div class="media-box">
            <img src="fotohome_720.png" alt="William Alencar" class="main-photo">
        </div>
        <br>
<!-- PLAYER ARTESANAL RANDOMIZADO -->
        <div class="player-artesanal">
            <!-- O 'src' começa vazio porque o JavaScript vai preencher com a música sorteada -->
            <audio id="musica-bg" src="" onended="resetarPlayer()"></audio>
            <span id="botao-player" onclick="controlarAudio()">📡 listening now</span>
        </div>
<!-- Seus Links -->
        <div class="links-box">
            <a href="https://wli.am/trabalho">🏝️ bio</a>
            <a href="https://youtube.com/@wliam" target="_blank">🪰 yt</a>
            <a href="mailto:williamalencar@gmail.com">🏓 email</a>
        </div>
    </div>

 <script>
    // 1. LISTA DE MÚSICAS: Substitua pelos nomes exatos dos arquivos que você subirá no GitHub
    var playlist = [
        "Del the Funky Homosapien - Corner Story.mp3",
        "pupillo - entree.mp3",
        "Jorge Ben Jor - Caramba.mp3",
        "Red Hot Chili Peppers - Hey.mp3",
        "Criolo - Nas Águas Espiral de Ilusão - Faixa 4.mp3",
        "Nação Zumbi - Quando a Maré Encher.mp3",
        "Jovelina Pérola Negra - Sorriso Aberto.mp3",
        "Gal Costa - Atimo de Som.mp3",
        "Odetta - Hit Or Miss.mp3",
        "Novos Baianos - Linguagem do alunte.mp3",
        "Sepultura x Sabotage - Black Steel In The Hour Of Chaos.mp3"
    ];

    // 2. SORTEIO: Escolhe uma música aleatória assim que a página carrega
    var musicaSorteada = playlist[Math.floor(Math.random() * playlist.length)];
    
    // Injeta a música escolhida na tag de áudio
    document.getElementById("musica-bg").src = musicaSorteada;

    // 3. CONTROLES DO PLAYER
    function controlarAudio() {
        var audio = document.getElementById("musica-bg");
        var botao = document.getElementById("botao-player");
        
        if (audio.paused) {
            audio.play();
            botao.innerHTML = "⏸️ pause";
        } else {
            audio.pause();
            botao.innerHTML = "📡 listening now";
        }
    }

    function resetarPlayer() {
        var botao = document.getElementById("botao-player");
        botao.innerHTML = "📡 listening now";
    }
    </script>

</body>
</html>
